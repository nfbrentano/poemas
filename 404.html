<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Poemas</title>
  <script type="text/javascript">
    // Preserve the original path for the SPA router
    var fullPath = window.location.pathname + window.location.search + window.location.hash;
    if (window.location.pathname !== '/poemas/' && window.location.pathname !== '/poemas/index.html') {
      sessionStorage.setItem('redirect', fullPath);
    }
    window.location.replace('/poemas/');
  </script>
</head>

</body>
</html>
