<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — Natanael Brentano</title>
  <style>
    :root {
      --bg: #050505;
      --text: #e2e2e2;
      --text-muted: #888888;
      --accent: #d4a373;
      --accent-hover: #faedcd;
      --border: #222222;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .not-found-container {
      max-width: 560px;
      margin: 0 auto;
    }
    .not-found-label {
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    .not-found-title {
      font-family: "Merriweather", Georgia, serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 1.25rem;
    }
    .not-found-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .not-found-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .not-found-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 3px;
      transition: color 0.2s, border-color 0.2s;
    }
    .not-found-link:hover {
      color: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .sep {
      color: var(--border);
    }
  </style>
  <script type="text/javascript">
    (function() {
      var basePath = '/';
      var pathname = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var fullPath = pathname + search + hash;
      
      var isAsset = /\.(js|css|png|jpg|jpeg|webp|gif|svg|ico|json|woff2?|map|xml|txt)$/i.test(pathname) || pathname.indexOf('/assets/') !== -1;
      if (isAsset) {
        return;
      }

      var cleanPath = '/' + pathname.replace(/\/+/g, '/').replace(/^\/|\/$/g, '');

      // Check legacy redirects
      var legacyRedirects = window.__LEGACY_REDIRECTS__ || {};
      var fullPathWithQuery = cleanPath + search;
      var legacyTarget = legacyRedirects[fullPathWithQuery] || legacyRedirects[search] || legacyRedirects[cleanPath] || legacyRedirects[pathname];
      if (legacyTarget) {
        window.location.replace(legacyTarget);
        return;
      }

      // Check known routes injected during build
      var knownRoutes = window.__KNOWN_ROUTES__ || [];
      var isKnown = false;
      for (var i = 0; i < knownRoutes.length; i++) {
        if (knownRoutes[i] === cleanPath || knownRoutes[i] === pathname) {
          isKnown = true;
          break;
        }
      }

      // If not a known route, stay on static 404 page (do NOT redirect to '/')
      if (!isKnown) {
        return;
      }

      // If it IS a known route that wasn't prerendered, redirect to SPA
      if (pathname !== basePath && pathname !== basePath + 'index.html') {
        var stored = false;
        try {
          sessionStorage.setItem('redirect', fullPath);
          stored = true;
        } catch (e) {}

        if (!stored) {
          window.location.replace(basePath + '?redirect=' + encodeURIComponent(fullPath));
          return;
        }
      }
      window.location.replace(basePath);
    })();
  </script>
</head>
<body>
  <div class="not-found-container">
    <p class="not-found-label">404</p>
    <h1 class="not-found-title">Página não encontrada</h1>
    <p class="not-found-desc">A página ou poema que você procura pode ter mudado de endereço ou nunca existiu.</p>
    <nav class="not-found-actions">
      <a href="/" class="not-found-link">Início</a>
      <span class="sep">•</span>
      <a href="/colecoes" class="not-found-link">Coleções</a>
      <span class="sep">•</span>
      <a href="/?busca=1" class="not-found-link">Buscar</a>
    </nav>
  </div>
</body>
</html>
