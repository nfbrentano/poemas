<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Poemas — Redirecionando...</title>
  <script type="text/javascript">
    (function() {
      var basePath = '/poemas/';
      var pathname = window.location.pathname;
      var fullPath = pathname + window.location.search + window.location.hash;
      
      var isAsset = /\.(js|css|png|jpg|jpeg|webp|gif|svg|ico|json|woff2?|map|xml|txt)$/i.test(pathname) || pathname.indexOf('/assets/') !== -1;
      if (isAsset) {
        return;
      }

      // Se não estiver na raiz, armazena para redirecionar no SPA
      if (pathname !== basePath && pathname !== basePath + 'index.html') {
        var stored = false;
        try {
          sessionStorage.setItem('redirect', fullPath);
          stored = true;
        } catch (e) {}

        // Se sessionStorage estiver desabilitado/bloqueado, usa query parameter como fallback seguro
        if (!stored) {
          window.location.replace(basePath + '?redirect=' + encodeURIComponent(fullPath));
          return;
        }
      }
      window.location.replace(basePath);
    })();
  </script>
</head>
<body>
  Redirecionando...
</body>
</html>
