name: Publish Scheduled Poems

on:
  schedule:
    # Executa a cada hora cheia
    - cron: '0 * * * *'
  workflow_dispatch: # Permite disparo manual pelo painel de Actions

permissions:
  contents: read
  actions: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish due scheduled poems
        id: publish
        run: node scripts/publish-scheduled-poems.js
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_ADMIN_EMAIL: ${{ secrets.FIREBASE_ADMIN_EMAIL }}
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}

      - name: Trigger Deploy & Rebuild
        if: steps.publish.outputs.published_count != '0' && steps.publish.outputs.published_count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publicação realizada (${{ steps.publish.outputs.published_count }} obra(s)). Disparando deploy de produção..."
          gh workflow run deploy.yml --ref main
